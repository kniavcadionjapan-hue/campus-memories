<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>那些年 · 初中回忆站</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f5f0e8;
  --board: #2b5a3a;
  --chalk: #f0e6d3;
  --green: #3a7a4e;
  --wood: #8b6914;
  --pink: #f4a4b8;
  --blue: #89c4e1;
  --yellow: #f9d56e;
  --text: #3a3a3a;
  --shadow: rgba(0,0,0,0.1);
}
body {
  font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}
/* ========== HERO HEADER ========== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  inset:0;
  opacity: 0.15;
  background:
    radial-gradient(circle at 20% 30%, #fff 1px, transparent 1px),
    radial-gradient(circle at 80% 60%, #fff 1px, transparent 1px);
  background-size: 40px 40px;
}
.hero::before {
  content: '🏫';
  position: absolute;
  font-size: 200px;
  opacity: 0.08;
  top: 10%;
  left: 5%;
}
.hero::after {
  content: '📚';
  position: absolute;
  font-size: 150px;
  opacity: 0.08;
  bottom: 10%;
  right: 5%;
}
.hero-title {
  
  font-size: clamp(3rem, 8vw, 6rem);
  color: #fff;
  text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  z-index: 1;
  text-align: center;
  animation: fadeInUp 1s ease;
}
.hero-sub {
  font-size: 1.3rem;
  color: rgba(255,255,255,0.85);
  margin-top: 1rem;
  z-index: 1;
  animation: fadeInUp 1s ease 0.3s both;
}
.hero-scroll {
  position: absolute;
  bottom: 40px;
  z-index: 1;
  animation: bounce 2s infinite;
  color: rgba(255,255,255,0.6);
  font-size: 2rem;
  cursor: pointer;
}

/* ========== 黑板區域 ========== */
.blackboard-section {
  padding: 60px 20px;
  background: linear-gradient(180deg, var(--board), #1d3d28);
}
.blackboard {
  max-width: 900px;
  margin: 0 auto;
  background: linear-gradient(145deg, #2e6a3e, #1d4d2a);
  border: 12px solid var(--wood);
  border-radius: 8px;
  padding: 40px;
  position: relative;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.blackboard::before {
  content: '📌';
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 2rem;
}
.blackboard-title {
  
  font-size: 2.5rem;
  color: var(--chalk);
  text-align: center;
  margin-bottom: 30px;
}
.blackboard-text {
  
  color: var(--chalk);
  font-size: 1.2rem;
  line-height: 2;
  white-space: pre-line;
}
.chalk-line {
  border: none;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--chalk), transparent);
  margin: 20px 0;
}
.chalk-cursor {
  display: inline-block;
  width: 12px;
  height: 20px;
  background: var(--chalk);
  animation: blink 1s steps(1) infinite;
  vertical-align: middle;
}

/* ========== 时间线 ========== */
.timeline-section {
  padding: 80px 20px;
  background: var(--bg);
}
.section-title {
  text-align: center;
  
  font-size: 2.8rem;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.section-sub {
  text-align: center;
  color: #888;
  margin-bottom: 50px;
}
.timeline {
  max-width: 800px;
  margin: 0 auto;
  position: relative;
  padding-left: 50px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 20px;
  top: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--blue), var(--pink), var(--yellow));
  border-radius: 3px;
}
.timeline-item {
  position: relative;
  margin-bottom: 50px;
  animation: fadeInUp 0.6s ease both;
}
.timeline-dot {
  position: absolute;
  left: -30px;
  top: 5px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  background: var(--blue);
}
.timeline-item:nth-child(2) .timeline-dot { background: var(--pink); }
.timeline-item:nth-child(3) .timeline-dot { background: var(--yellow); }
.timeline-item:nth-child(4) .timeline-dot { background: #a8e6cf; }
.timeline-item:nth-child(5) .timeline-dot { background: #ffaaa5; }
.timeline-date {
  font-size: 0.9rem;
  color: #888;
  font-weight: 500;
  margin-bottom: 5px;
}
.timeline-card {
  background: #fff;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 4px 20px var(--shadow);
  transition: transform 0.3s, box-shadow 0.3s;
}
.timeline-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}
.timeline-card h3 {
  font-size: 1.2rem;
  margin-bottom: 8px;
  color: #333;
}
.timeline-card p {
  color: #666;
  line-height: 1.7;
  font-size: 0.95rem;
}
.timeline-tag {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  margin-top: 10px;
  margin-right: 6px;
}
.tag-blue { background: #e3f2fd; color: #1976d2; }
.tag-pink { background: #fce4ec; color: #c2185b; }
.tag-green { background: #e8f5e9; color: #388e3c; }
.tag-orange { background: #fff3e0; color: #f57c00; }

/* ========== 回忆牆/同学录 ========== */
.memory-wall {
  padding: 80px 20px;
  background: linear-gradient(135deg, #667eea15, #764ba215);
}
.memory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 25px;
  max-width: 1000px;
  margin: 0 auto;
}
.memory-card {
  background: #fff;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 4px 20px var(--shadow);
  transition: all 0.3s;
  position: relative;
}
.memory-card:hover {
  transform: translateY(-5px) rotate(-0.5deg);
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
}
.memory-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  margin-bottom: 12px;
}
.memory-card h4 {
  font-size: 1.1rem;
  margin-bottom: 5px;
}
.memory-card .date {
  font-size: 0.8rem;
  color: #aaa;
  margin-bottom: 10px;
}
.memory-card p {
  font-size: 0.9rem;
  color: #555;
  line-height: 1.6;
}
.memory-emoji { font-size: 2rem; margin-bottom: 10px; }

/* ========== 留言牆 ========== */
.guestbook {
  padding: 60px 20px;
  background: var(--bg);
}
.guestbook-form {
  max-width: 500px;
  margin: 0 auto 40px;
  background: #fff;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 4px 20px var(--shadow);
}
.guestbook-form h3 {
  text-align: center;
  margin-bottom: 20px;
}
.guestbook-form input,
.guestbook-form textarea {
  width: 100%;
  padding: 12px 15px;
  border: 2px solid #eee;
  border-radius: 12px;
  font-size: 1rem;
  font-family: inherit;
  margin-bottom: 15px;
  transition: border-color 0.3s;
  resize: vertical;
}
.guestbook-form input:focus,
.guestbook-form textarea:focus {
  outline: none;
  border-color: var(--blue);
}
.guestbook-form button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.guestbook-form button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102,126,234,0.4);
}
.guestbook-messages {
  max-width: 600px;
  margin: 0 auto;
}
.message-item {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 12px;
  animation: fadeInUp 0.3s ease;
  box-shadow: 0 2px 10px var(--shadow);
}
.message-item strong {
  color: #333;
}
.message-item .time {
  font-size: 0.8rem;
  color: #aaa;
  float: right;
}
.message-item p {
  margin-top: 8px;
  color: #555;
  line-height: 1.6;
}

/* ========== FOOTER ========== */
footer {
  text-align: center;
  padding: 40px;
  color: #888;
  font-size: 0.9rem;
}

/* ========== ANIMATIONS ========== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(10px); }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .blackboard { padding: 20px; }
  .timeline { padding-left: 40px; }
  .timeline-dot { left: -25px; width: 16px; height: 16px; }
}

/* 零食櫥窗 */
.candy-display {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
}
.candy-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--pink), var(--yellow));
  cursor: pointer;
  font-size: 1.8rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  transition: transform 0.3s;
}
.candy-btn:hover { transform: scale(1.1) rotate(10deg); }

/* 音乐播放器浮窗 */
.music-player {
  position: fixed;
  bottom: 90px;
  right: 20px;
  z-index: 100;
  display: none;
}
.music-player.show { display: block; }
.music-controls {
  display: flex;
  gap: 10px;
  align-items: center;
  background: #fff;
  padding: 10px 15px;
  border-radius: 30px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.music-controls button {
  border: none;
  background: none;
  font-size: 1.2rem;
  cursor: pointer;
  padding: 5px;
}
</style>
</head>
<body>

<!-- ========== HERO ========== -->
<section class="hero">
  <div class="hero-bg"></div>
  <h1 class="hero-title">那些年，我们一起走过的初中</h1>
  <p class="hero-sub">2014 — 2017 · 青春不散场</p>
  <div class="hero-scroll" onclick="document.querySelector('.blackboard-section').scrollIntoView({behavior:'smooth'})">⌄</div>
</section>

<!-- ========== 黑板 ========== -->
<section class="blackboard-section">
  <div class="blackboard">
    <div class="blackboard-title">📝 班长的话</div>
    <hr class="chalk-line">
    <div class="blackboard-text" id="typewriter"></div>
    <hr class="chalk-line">
    <div style="text-align:right;color:var(--chalk);font-family:'Noto Sans SC';margin-top:15px;">—— 致我们永不褪色的三年</div>
  </div>
</section>

<!-- ========== 时间线 ========== -->
<section class="timeline-section">
  <h2 class="section-title">⏳ 我们的时间线</h2>
  <p class="section-sub">那些年一起做过的傻事，现在看都是最好的回忆</p>
  <div class="timeline" id="timelineContainer"></div>
</section>

<!-- ========== 回忆牆 ========== -->
<section class="memory-wall">
  <h2 class="section-title">📸 回忆牆</h2>
  <p class="section-sub">每个人心中都有一个最好的同学</p>
  <div class="memory-grid" id="memoryGrid"></div>
</section>

<!-- ========== 留言牆 ========== -->
<section class="guestbook">
  <h2 class="section-title">💬 同学留言板</h2>
  <p class="section-sub">留下你想对同学们说的话</p>
  <div class="guestbook-form">
    <h3>✏️ 写下你的留言</h3>
    <input type="text" id="msgName" placeholder="你的名字（或外号）" maxlength="20">
    <textarea id="msgContent" rows="3" placeholder="想说的话..." maxlength="200"></textarea>
    <button onclick="addMessage()">📮 发送留言</button>
  </div>
  <div class="guestbook-messages" id="messageList"></div>
</section>

<!-- ========== 音乐播放器 ========== -->
<div class="candy-display">
  <button class="candy-btn" onclick="toggleMusic()">🎵</button>
</div>
<div class="music-player" id="musicPlayer">
  <div class="music-controls">
    <button onclick="togglePlay()" id="playBtn">▶️</button>
    <span id="songTitle">晴天 - 周杰伦</span>
    <button onclick="toggleMusic()">✕</button>
  </div>
  <audio id="bgMusic" loop>
    <source src="https://music.163.com/song/media/outer/url?id=1860163.mp3" type="audio/mpeg">
  </audio>
</div>

<footer>
  🌱 献给我们的初中时光 · 青春是一场没有返程的旅行
</footer>

<script>
// ========== 黑板打字机 ==========
const boardText = \`还记得吗？

2014年的夏天，我们穿着崭新的校服走进那间教室。
谁也不认识谁，谁也不知道，接下来的三年会成为一生中最珍贵的回忆。

军训的时候——
站军姿站到腿发抖，晚上卻在宿舍偷偷分享一包泡麵。
汇演时唱《團结就是力量》，有人唱破了音，有人唱红了眼。

初一，我们开始熟悉彼此。
女生结伴去厕所，男生在走廊追逐打闹。
第一次月考，有人考砸了哭了一整个午休。

初二，我们有了自己的小圈子。
课间偷偷传纸条，放学后一起去买五毛钱的辣条。
那个夏天，操场上的夕陽永远那么好看。

初三，黑板上的倒计时从280天變成0。
课桌上的卷子越堆越高，在一起的时间越来越少。
百日誓师那天，全班喊到嗓子沙啞。

最后一科考完的那个下午——
阳光很燦爛，风很溫柔。
我们在校门口说「再见」，以为真的会再见。

后来我们去了不同的城市，有了新的同学和朋友。
但每次路过母校，还是会忍不住往里面看。

那些年，是最好的我们。
那些年，是最好的时光。

—— 致我们永不褪色的三年。\`;

function typeWriter(text, element, speed = 50) {
  let i = 0;
  function type() {
    if (i < text.length) {
      element.innerHTML = text.slice(0, i + 1) + '<span class="chalk-cursor"></span>';
      i++;
      setTimeout(type, speed);
    } else {
      element.innerHTML = text;
    }
  }
  type();
}

// ========== 时间线数据 ==========
const timelineData = [
  { date: '2014年9月', title: '🎒 初入校园', content: '第一次踏进校门，嶄新的书包里装着暑假作业和期待。教室里五十几张陌生的脸，谁也不知道接下来的三年会发生什么。班主任在黑板写下：「欢迎来到初中。」', tags: ['开学', '初识'] },
  { date: '2014年10月', title: '🏕️ 军训', content: '站军姿站到腿軟，走正步走到脚麻。晚上宿舍里一起偷吃泡麵，被教官抓到罰做五十个俯臥撑。汇演那天唱《團结就是力量》，唱着唱着有人哭了。', tags: ['军训', '记忆'] },
  { date: '2014年12月', title: '🎄 圣诞晚会', content: '班里第一次搞晚会，教室掛满了彩带和气球。有人唱歌跑调，全班笑得拍桌子。班长偷偷准备了圣诞礼物，每人一张手写卡片。那晚谁也没写作业。', tags: ['晚会', '欢乐'] },
  { date: '2015年3月', title: '📚 第一次月考', content: '初中第一次正经考试。数学考完一片哀嚎，有人说选择题全靠蒙。成绩出来那天，有人哭有人笑。班主任说：「这只是开始。」当时覺得好残忍，现在想真是这样。', tags: ['考试', '成长'] },
  { date: '2015年4月', title: '🏃 春季运动会', content: '4×100接力最后一棒，我们班落后十米。结果最后一棒像开了挂一样连超三人，冲线那一刻全班炸了！那年我们拿了年级第三，奖状貼在教室后牆貼了三年。', tags: ['运动会', '热血'] },
  { date: '2015年6月', title: '🎤 校园歌手大赛', content: '文艺委员代表我们班唱了一首《那些年》。上台前她紧张得发抖，全班在台下喊「加油」。音乐响起全场安静，唱到副歌有人跟着哼。最后拿了二等奖，但我们心里她就是第一。', tags: ['文艺', '感动'] },
  { date: '2015年9月', title: '🍂 初二分班', content: '最捨不得的一天。原来的班级被打散重组，好朋友分到了不同班。那天好多人在走廊哭。新班级的第一节课，大家都很沉默。后来慢慢认识了新同学，才发现原来也可以这么好。', tags: ['分班', '离别'] },
  { date: '2015年11月', title: '📝 第一次家长会', content: '成绩单发下来那天，很多人把试卷藏起来了。家长会结束后，校门口一排排家长黑着脸，氣氛凝重。有个同学的家长会后追着他跑了三条街，成了班里永远的笑话。', tags: ['家长会', '趣事'] },
  { date: '2016年3月', title: '🌸 春游', content: '全班一起去植物园。女生忙着拍照，男生忙着抓蟲子嚇女生。中午野餐，大家交换零食，有人带了媽媽做的寿司，被一抢而空。回程大巴上全班合唱，司机师傅说第一次见这么吵的班。', tags: ['春游', '欢乐'] },
  { date: '2016年6月', title: '⚽ 班级足球赛', content: '雨战！操场全是水坑，球踢起来带起一片水花。比分2:2，最后五分鐘前鋒一个远射，球划出弧线鑽进球门。全班冲进雨里庆祝，衣服濕透了也没人在乎。那张渾身泥水的合照，现在还在抽屉里。', tags: ['足球', '热血'] },
  { date: '2016年9月', title: '🎯 初三开学', content: '教室从三楼搬到四楼，黑板上多了「距中考还有280天」。班主任表情严肃地说：「这一年，会是你们人生中最重要的一年。」牆上的倒计时每天都在變，课桌上的书越堆越高。', tags: ['初三', '奋斗'] },
  { date: '2016年11月', title: '🌙 晚自习', content: '每天六点半到九点，教室里只有笔尖划过纸张的声音。偶尔有人小声討论题目，被值班老师瞪一眼。最期待的就是课间十分鐘——冲去小卖部买一瓶可乐，就是最大的幸福。', tags: ['晚自习', '日常'] },
  { date: '2017年1月', title: '❄️ 跨年倒计时', content: '跨年那天，班长在黑板上写了「新年快乐，中考加油」。全班在倒计时牌前合影，笑得都很用力。其實每个人心里都清楚，离分別越来越近了。', tags: ['倒计时', '珍惜'] },
  { date: '2017年3月', title: '📖 百日誓师', content: '全体初三生在操场上宣誓。喊口号的时候有人哭有人笑，班主任也红了眼眶。「拼搏一百天，让梦想在六月飞翔。」——现在念出这句话，还是会起鸡皮疙瘩。', tags: ['誓师', '感动'] },

// ========== 渲染时间线 ==========
function renderTimeline() {
  const container = document.getElementById('timelineContainer');
  timelineData.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'timeline-item';
    el.style.animationDelay = i * 0.15 + 's';
    const tags = item.tags.map(t => `<span class="timeline-tag tag-blue">${t}</span>`).join('');
    el.innerHTML = `
      <div class="timeline-dot"></div>
      <div class="timeline-date">${item.date}</div>
      <div class="timeline-card">
        <h3>${item.title}</h3>
        <p>${item.content}</p>
        <div>${tags}</div>
      </div>
    `;
    container.appendChild(el);
  });
}

// ========== 渲染回忆牆 ==========
function renderMemoryWall() {
  const grid = document.getElementById('memoryGrid');
  const colors = ['#e3f2fd', '#fce4ec', '#e8f5e9', '#fff3e0', '#f3e5f5', '#e0f7fa'];
  memoryData.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'memory-card';
    const color = colors[i % colors.length];
    el.innerHTML = `
      <div class="memory-avatar" style="background:${color}">${item.emoji}</div>
      <h4>給 ${item.name}</h4>
      <p>${item.msg}</p>
    `;
    grid.appendChild(el);
  });
}

// ========== 留言板 ==========
let messages = JSON.parse(localStorage.getItem('juniorMessages') || '[]');

function renderMessages() {
  const list = document.getElementById('messageList');
  list.innerHTML = messages.map(m => `
    <div class="message-item">
      <strong>${m.name}</strong> <span class="time">${m.time}</span>
      <p>${m.content}</p>
    </div>
  `).join('');
}

function addMessage() {
  const name = document.getElementById('msgName').value.trim() || '匿名同学';
  const content = document.getElementById('msgContent').value.trim();
  if (!content) return alert('写点什么吧~');
  messages.unshift({
    name,
    content,
    time: new Date().toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
  });
  localStorage.setItem('juniorMessages', JSON.stringify(messages));
  renderMessages();
  document.getElementById('msgContent').value = '';
}

// ========== 音乐 ==========
let musicPlaying = false;
function toggleMusic() {
  const p = document.getElementById('musicPlayer');
  p.classList.toggle('show');
}
function togglePlay() {
  musicPlaying = !musicPlaying;
  // 音乐版权问题，演示效果用文字提示
  if (musicPlaying) {
    alert('🎵 那首歌在记忆里浮现：\n「那些年錯过的大雨，那些年錯过的愛情……」');
  }
}

// ========== 初始化 ==========
setTimeout(() => {
  typeWriter(boardText, document.getElementById('typewriter'));
}, 500);
renderTimeline();
renderMemoryWall();
renderMessages();

// ========== 滾动动画 ==========
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.opacity = '1';
      entry.target.style.transform = 'translateY(0)';
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll('.timeline-item').forEach(el => {
  el.style.opacity = '0';
  el.style.transform = 'translateY(30px)';
  el.style.transition = 'all 0.6s ease';
  observer.observe(el);
});
</script>
